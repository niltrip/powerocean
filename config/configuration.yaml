# https://www.home-assistant.io/integrations/default_config/
default_config:

# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: false

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.powerocean: debug
  filters:
    homeassistant.components.go2rtc:
      - "Could not find go2rtc docker binary"
    homeassistant.setup:
      - ".*go2rtc.*"
template:
  # Examples for the PowerOcean sensors. Replace SN with the serial number of
  # your inverter in lowercase; check the entity IDs under
  # Settings -> Devices & services -> Entities, they depend on the device name.
  - sensor:
      # Solar power without negative values, source of the kWh sensors below
      - name: "PowerOcean Solar All"
        unique_id: "powerocean_solar_all"
        unit_of_measurement: "W"
        device_class: "power"
        icon: mdi:home-lightning-bolt
        state: >
          {% set val = states('sensor.powerocean_SN_mpptpv_pwrtotal')|float(0) %}
          {{ val if val > 0 else 0 }}
        availability: >
          {{ has_value('sensor.powerocean_SN_mpptpv_pwrtotal') }}
      - name: "PowerOcean Solar String 01"
        unique_id: "powerocean_solar_string_01"
        unit_of_measurement: "W"
        device_class: "power"
        icon: mdi:home-lightning-bolt
        state: >
          {% set val = states('sensor.powerocean_SN_mpptpv1_pwr')|float(0) %}
          {{ val if val > 0 else 0 }}
        availability: >
          {{ has_value('sensor.powerocean_SN_mpptpv1_pwr') }}
      - name: "PowerOcean Solar String 02"
        unique_id: "powerocean_solar_string_02"
        unit_of_measurement: "W"
        device_class: "power"
        icon: mdi:home-lightning-bolt
        state: >
          {% set val = states('sensor.powerocean_SN_mpptpv2_pwr')|float(0) %}
          {{ val if val > 0 else 0 }}
        availability: >
          {{ has_value('sensor.powerocean_SN_mpptpv2_pwr') }}

      # Battery: capacity (kWh) and backup reserve (%) of your own system
      - name: "House Battery Charge Runtime"
        unique_id: house_battery_charge_runtime
        unit_of_measurement: "h"
        device_class: duration
        state_class: measurement
        availability: >
          {{
            has_value('sensor.powerocean_SN_bpsoc')
            and has_value('sensor.powerocean_SN_solartobattery')
          }}
        state: >
          {% set battery_capacity = 10.0 %}
          {% set soc = states('sensor.powerocean_SN_bpsoc') | float %}
          {% set charging_power =
            states('sensor.powerocean_SN_solartobattery') | float %}

          {% if charging_power > 0 %}
            {% set remaining_capacity =
              battery_capacity * ((100 - soc) / 100) %}
            {{ (remaining_capacity * 1000 / charging_power) | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "House Battery Discharge Runtime"
        unique_id: house_battery_discharge_runtime
        unit_of_measurement: "h"
        device_class: duration
        state_class: measurement
        availability: >
          {{
            has_value('sensor.powerocean_SN_bpsoc')
            and has_value('sensor.powerocean_SN_batterytohouse')
          }}
        state: >
          {% set battery_capacity = 10.0 %}
          {% set backup_percent = 5.0 %}
          {% set soc = states('sensor.powerocean_SN_bpsoc') | float %}
          {% set battery_load =
            states('sensor.powerocean_SN_batterytohouse') | float %}

          {% if battery_load > 0 %}
            {% set usable_percent = [soc - backup_percent, 0] | max %}
            {% set available_capacity =
              battery_capacity * (usable_percent / 100) %}
            {{ (available_capacity * 1000 / battery_load) | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "House Battery Empty At"
        unique_id: house_battery_empty_at
        device_class: timestamp
        availability: >
          {{
            has_value('sensor.powerocean_SN_bpsoc')
            and has_value('sensor.powerocean_SN_batterytohouse')
          }}
        state: >
          {% set battery_load =
            states('sensor.powerocean_SN_batterytohouse') | float %}
          {% set battery_capacity = 10.0 %}
          {% set backup_percent = 5.0 %}
          {% set soc = states('sensor.powerocean_SN_bpsoc') | float %}

          {% if battery_load > 0 and soc > backup_percent %}
            {% set usable_percent = soc - backup_percent %}
            {% set available_capacity =
              battery_capacity * (usable_percent / 100) %}
            {% set runtime =
              available_capacity / (battery_load / 1000) %}
            {{ (now() + timedelta(hours=runtime)).isoformat() }}
          {% else %}
            {{ none }}
          {% endif %}

sensor:
  # Solar energy (kWh) for the energy dashboard, from the power sensors above
  - platform: integration
    source: sensor.powerocean_solar_all
    name: "PowerOcean Solar All kWh"
    unique_id: powerocean_solar_all_kWh
    unit_prefix: k
    unit_time: h
    round: 2
    method: left

  - platform: integration
    source: sensor.powerocean_solar_string_01
    name: "PowerOcean Solar String 01 kWh"
    unique_id: powerocean_solar_string_01_kWh
    unit_prefix: k
    unit_time: h
    round: 2
    method: left

  - platform: integration
    source: sensor.powerocean_solar_string_02
    name: "PowerOcean Solar String 02 kWh"
    unique_id: powerocean_solar_string_02_kWh
    unit_prefix: k
    unit_time: h
    round: 2
    method: left
